- name: Deploy Kanboard
  hosts: docker
  become: true 
  tasks:

    - name: Create Network
      community.docker.docker_network:
        name: kanboard 

    - name: Deploy kanboard database
      community.docker.docker_container:
        name: kanboarddb 
        image: mariadb:latest
        networks:
          - name: kanboard
        command: '--default-authentication-plugin=mysql_native_password'
        volumes:
          - kanboard_data:/var/www/app/data
          - kanboard_plugins:/var/www/app/plugins
          - kanboard_ssl:/etc/nginx/ssl
        env:
          MYSQL_ROOT_PASSWORD: not2bright
          MYSQL_DATABASE: kanboard
          MYSQL_USER: kanboard
          MYSQL_PASSWORD: not2bright
        state: started
        restart_policy: unless-stopped



    - name: Deploy kanboard
      community.docker.docker_container:
        name: kanboard
        image: kanboard/kanboard:latest
        ports:
          - "8088:80"
        networks:
          - name: kanboard
        env: 
          WORDPRESS_DB_HOST: kanboarddb
          WORDPRESS_DB_USER: kanboard
          WORDPRESS_DB_PASSWORD: not2bright
          WORDPRESS_DB_NAME: kanboard
        state: started
        restart_policy: unless-stopped